<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test_animation</title>
    <link rel="stylesheet" href="test_animation.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
    <script src="test_animation.js" defer></script>
</head>
<body>
    <div id="presentation" data-slide-count="1">
        <div class="progress-bar" id="progress"></div>
        <div class="stage-wrapper">
            <div class="slide-stage">
                <div class="slide active" data-slide="1" data-transition-effect="cut" data-transition-direction="" style="background-color: #FFFFFF;"><div class="ppt-element" id="shape_2" data-shape-id="2" style="position: absolute; left: 0.00px; top: 0.00px; width: 0.00px; height: 0.00px; z-index: 1; transform-origin: 0.00px 0.00px; background-color: transparent; pointer-events: none"></div><div class="ppt-element" id="shape_3" data-shape-id="3" style="position: absolute; left: 96.00px; top: 96.00px; width: 96.00px; height: 96.00px; z-index: 2; transform-origin: 48.00px 48.00px; background-color: transparent"><svg viewBox="0.0 0.0 100.0 100.0" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%; overflow: visible;"><path d="M 10 0 L 90 0 Q 100 0 100 10 L 100 90 Q 100 100 90 100 L 10 100 Q 0 100 0 90 L 0 10 Q 0 0 10 0 Z" fill="none" stroke="#000000" stroke-width="0" /></svg><div class="ppt-text-block" style="position: relative; display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 4.80px 9.60px 4.80px 9.60px; overflow: visible"><div class="ppt-text-inner" style="width: 100%; white-space: normal; overflow-wrap: break-word; word-break: break-word"><p class="ppt-paragraph" style="text-align: left; margin-top: 0.00px; margin-bottom: 0.00px; margin-left: 0.00px; margin-right: 0.00px; white-space: pre-wrap"><span style="font-family: 'Arial'; font-size: 24.0px; color: #000000">Animated Shape</span></p></div></div></div><div class="group-shape" style="position: absolute; left: 0.00px; top: 0.00px; width: 0.00px; height: 0.00px; z-index: 3"></div><div class="slide-number">1 / 1</div></div>
                <div class="transition-blackout" id="transitionBlackout"></div>
            </div>
        </div>
        <div class="controls">
            <button id="prev" type="button">← Previous</button>
            <button id="next" type="button">Next →</button>
        </div>
    </div>
</body>
</html>
